<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Internship Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <div class="header">
    <div>
        <h1>🇮🇳 PM Internship Finder</h1>
        <p>Ministry of Corporate Affairs · SIH25033</p>
    </div>
    <span class="header-badge">AI Powered</span>
</div>
        <form action="/match" method="POST" class="form-card">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" min="21" max="24" placeholder="21-24" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>State</label>
                    <select name="state" required>
                        <option value="">Select State</option>
                        <option>Andhra Pradesh</option>
                        <option>Bihar</option>
                        <option>Delhi</option>
                        <option>Gujarat</option>
                        <option>Haryana</option>
                        <option>Karnataka</option>
                        <option>Kerala</option>
                        <option>Madhya Pradesh</option>
                        <option>Maharashtra</option>
                        <option>Punjab</option>
                        <option>Rajasthan</option>
                        <option>Tamil Nadu</option>
                        <option>Telangana</option>
                        <option>Uttar Pradesh</option>
                        <option>Uttarakhand</option>
                        <option>West Bengal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Education</label>
                    <select name="education" required>
                        <option value="">Select</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Diploma">Diploma</option>
                        <option value="12th Pass">12th Pass</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Your Skills <span class="hint">(comma separated — e.g. Python, Excel, SQL)</span></label>
                <input type="text" name="skills" placeholder="Python, Flask, HTML, Excel" required>
            </div>

            <div class="form-group">
                <label>Preferred Sector</label>
                <select name="sector_preference" required>
                    <option value="">Select Sector</option>
                    <option value="IT">IT</option>
                    <option value="Banking">Banking</option>
                    <option value="Oil & Gas">Oil & Gas</option>
                    <option value="Automotive">Automotive</option>
                    <option value="Energy">Energy</option>
                    <option value="Food & Retail">Food & Retail</option>
                    <option value="Pharma">Pharma</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Travel">Travel</option>
                    <option value="Hospitality">Hospitality</option>
                    <option value="Telecom">Telecom</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                </select>
            </div>

            <div class="form-group">
                <label>Minimum Stipend Expected (₹/month)</label>
                <input type="number" name="stipend_expectation" placeholder="e.g. 10000" required>
            </div>

            <div class="form-row">
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" name="rural" value="yes">
                        From Rural Area
                    </label>
                </div>
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" name="differently_abled" value="yes">
                        Differently Abled
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Find My Internships →</button>

        </form>

        <div class="footer">
            <a href="/admin">Admin Dashboard</a>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
